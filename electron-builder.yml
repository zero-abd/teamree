# Packaging for the three desktop platforms. Run it through the npm scripts
# (`npm run package:mac`, `:win`, `:linux`) so the app is rebuilt first.
#
# Code signing is off by default and switched on by the environment, not by an
# edit here: `npm run package:mac` reads a documented set of variables and
# overrides the three `mac:` settings below when they are all present. See
# `docs/releasing.md`, and the `win:` block for the Windows equivalent.
appId: dev.teamree.app

# Lower-case on purpose. Electron derives `app.getPath('userData')` from the app
# name, and the CLI looks for the runtime's discovery file under a directory
# literally called `teamree` (src/cli/discovery.ts). Renaming this would hide the
# running app from its own CLI.
productName: teamree
copyright: Copyright © teamree contributors

directories:
  buildResources: build
  output: dist

# electron-builder resolves the production dependency tree itself, so
# devDependencies never reach the bundle. What is listed here is everything the
# main process loads at runtime; the renderer and the CLI are already bundled.
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - node_modules/**/*
  # Source maps, type declarations and package docs are dead weight in a
  # shipped app; the main process reads none of them.
  - '!**/*.{map,md,markdown,ts,mts,cts,tsbuildinfo}'
  # Windows debug symbols shipped alongside node-pty's prebuilt binaries.
  - '!**/*.pdb'
  - '!**/*.{test,spec}.js'
  - '!**/{test,tests,__tests__,example,examples,docs,.github}/**'
  # Renderer-only dependencies: Vite has already bundled these into
  # out/renderer, so shipping their sources again is pure weight.
  - '!node_modules/react/**'
  - '!node_modules/react-dom/**'
  - '!node_modules/scheduler/**'
  - '!node_modules/@xterm/**'
  - '!node_modules/zustand/**'
  - '!node_modules/@codemirror/**'
  - '!node_modules/@lezer/**'
  - '!node_modules/@marijn/**'
  - '!node_modules/crelt/**'
  - '!node_modules/style-mod/**'
  - '!node_modules/w3c-keyname/**'
  # node-pty's build inputs. The prebuilt binaries stay; the C++ sources,
  # vendored dependencies and gyp files that produced them do not.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,binding.gyp}'
  # Windows and Linux prebuilds, kept out of the package rather than deleted
  # from it afterwards — which is not the same thing, and the difference stopped
  # a universal build dead.
  #
  # scripts/afterpack.mjs also prunes foreign prebuilds, and has to: it is the
  # only place that knows the target of a build. But it runs *after* the asar is
  # written, so what it deletes stays listed in the archive's header as an
  # unpacked file that is no longer on disk. Nothing ever looks, for a
  # single-architecture build, so that was harmless and invisible for as long as
  # this shipped one. The universal merge enumerates every unpacked entry and
  # stopped on `prebuilds/win32-arm64/conpty.node` — a Windows binary, in a
  # macOS build, that the packager had been told about and then had taken away.
  #
  # Here, and not under `mac.files`. A `files` list under a platform block is a
  # trap on electron-builder 26.15.3, and this is what it actually does, built
  # and measured rather than read:
  #
  # `doMergeConfigs` runs `normalizeFiles` over the *top-level* `files` and
  # nothing else, which folds this list of strings into one file set —
  # `[{filter: [...]}]`. A platform block's `files` is left as plain strings.
  # `getFileMatchers` then sorts the two by shape: a file set becomes a matcher
  # of its own, plain strings go into the default matcher, and the default
  # matcher is put first. So adding `mac.files` does not replace this list and
  # does not add to it either — it inserts a second, *primary* matcher carrying
  # only the platform patterns. Those are all exclusions, so electron-builder
  # sees a matcher that contains only ignores and prepends `**/*` to it, and
  # that matcher copies the entire project directory. Both matchers run, so
  # everything this list selects is still packaged, with the whole checkout
  # alongside it.
  #
  # Measured here with two `--dir` builds of the same tree: adding a two-line
  # `mac.files` put README.md, ROADMAP.md, docs/, examples/, relay/ and src/
  # into the asar, which is the shape of the 263 MB → 1.4 GB blow-up an earlier
  # note in this file recorded. electron-builder's own dist/builder-debug.yml
  # shows it plainly — `firstOrDefaultFilePatterns` loses every pattern below
  # and gains `**/*`.
  #
  # So these stay global, and the cost of that is real: a Windows build now
  # packages no Windows PTY. It fails loudly when that happens — afterPack checks
  # for the binary by name and says which platform it is missing — and nobody
  # builds Windows today. Reviving it means deleting these two lines.
  - '!node_modules/node-pty/prebuilds/{win32-*,linux-*}'
  - '!node_modules/node-pty/prebuilds/{win32-*,linux-*}/**'

# The CLI ships next to the app rather than inside the asar: it is executed as a
# separate process (see resources/cli/teamree), and an archived file cannot be
# handed to a Node runtime as an entry point.
extraResources:
  - from: out/cli/index.js
    to: cli/teamree.mjs
  - from: resources/cli/teamree
    to: cli/teamree
  - from: resources/cli/teamree.cmd
    to: cli/teamree.cmd
  - from: resources/cli/teamree.ps1
    to: cli/teamree.ps1

# The relay's deployable project, shipped so that standing one up needs no clone
# of this repository. That was the whole of a usability failure: the instructions
# said `cd relay && npm install`, which is true only inside a checkout, and
# somebody who installed the .dmg has none — so what they got was npm's ENOENT
# about a package.json that was never going to be there.
#
# `relay/teamree-relay` writes this tree into a directory the person owns and
# runs Wrangler there, so nothing is ever deployed or installed from inside the
# app bundle: /Applications is code-signed, may be read-only, and is not
# somewhere a person's edited `wrangler.jsonc` should live.
#
# Listed file by file rather than as one filtered copy of `relay/`, because a
# filter that lets `relay/node_modules` through would put tens of thousands of
# files into every artifact, and the failure mode of getting it wrong is silent
# weight rather than a build error. scripts/verify-package.mjs checks that every
# path below is in the built app and that the launcher is executable.
  - from: relay/teamree-relay
    to: relay/teamree-relay
  - from: relay/teamree-relay.cmd
    to: relay/teamree-relay.cmd
  - from: relay/bin/teamree-relay.mjs
    to: relay/bin/teamree-relay.mjs
  - from: relay/wrangler.jsonc
    to: relay/wrangler.jsonc
  - from: relay/src/core
    to: relay/src/core
  - from: relay/src/workers
    to: relay/src/workers
  # The Node host, which is what `teamree-relay serve` writes out, builds and
  # runs for somebody who would rather their relay lived on a machine they can
  # see than in a Cloudflare account. Same reason as everything above it: a .dmg
  # user has no clone, so a command that needs these sources has to find them
  # inside the app or it is a command they cannot run at all.
  - from: relay/src/node
    to: relay/src/node

# `teamree://join?…` invitation links (src/main/invitationLinks.ts). Registered by
# the installed app only; a development run never claims the scheme.
protocols:
  - name: teamree invitation
    schemes: [teamree]

asar: true
# node-pty loads a .node binary and then execs a sibling `spawn-helper`
# executable. Neither can be read out of an asar archive, so the whole package
# is unpacked; node-pty itself rewrites `app.asar` to `app.asar.unpacked` in the
# helper path it computes. Without this, every PTY spawn fails in a packaged app.
asarUnpack:
  - '**/node_modules/node-pty/**'

# node-pty's prebuilt binaries are N-API, so they are ABI-stable across Node and
# Electron and must not be recompiled at package time. On Linux there is no
# prebuilt binary at all: `npm install` compiles one into
# node_modules/node-pty/build/Release, which is why a Linux artifact has to be
# built on Linux.
npmRebuild: false

afterPack: scripts/afterpack.mjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  # One download, and therefore no architecture in the name: a universal build
  # runs on Apple Silicon and on Intel, so there is nothing for somebody to pick
  # and nothing for them to pick wrong. A menu of four files is a menu three of
  # whose entries are a mistake waiting to be made by the person least able to
  # tell — which is anybody who has not thought about what is inside their Mac.
  #
  # The cost is honest and it is size: the app carries both architectures. That
  # buys a download nobody has to think about, and thinking about it is the only
  # thing the split ever saved.
  artifactName: ${productName}-${version}.${ext}
  target:
    - target: dmg
      arch: [universal]
  # node-pty's prebuilt binaries are the one thing in this app that is
  # deliberately *not* merged into a fat binary, and this names them so the
  # merge lets them through.
  #
  # Each architecture's slice carries both of them — see scripts/afterpack.mjs
  # for why: `node-gyp-build` resolves `prebuilds/darwin-<arch>` from
  # `process.arch` at run time, so a universal app needs both present under
  # their own names. That makes each file byte-identical in the two slices, and
  # an identical single-architecture Mach-O is exactly what the merger refuses
  # by default, because it is usually a mistake: a binary that will not run on
  # half the machines the artifact claims. Here it is intentional, and this is
  # how that is said.
  #
  # The option is named for x64 and is not limited to it; it governs any Mach-O
  # the two slices agree on. Everything it does not match — the Electron
  # framework, the helpers — is still lipo'd into one binary as it should be.
  x64ArchFiles: '**/node-pty/prebuilds/**'

  # A compiled node-pty would stop the universal merge dead, and there is
  # deliberately no `mac.files` here excluding it. Recorded rather than fixed,
  # because both places it could be written are worse than the hazard.
  #
  # `npm install` compiles node-pty into `build/Release/pty.node` wherever there
  # is no prebuild for the host. macOS has prebuilds for both architectures, so
  # a Mac normally has no such file and this has never bitten. A Mac that ended
  # up with one — node-gyp run by hand, or node-pty bumped to a version with no
  # darwin prebuild — would package a single-architecture Mach-O that is
  # byte-identical in both slices and that `x64ArchFiles` above does not match,
  # and `@electron/universal` would refuse the merge with "Detected file ... not
  # covered by the x64ArchFiles rule" at the end of a long build.
  #
  # Excluding it in the top-level `files` would take the Linux artifact's only
  # PTY away: node-pty publishes no Linux prebuild and `build/Release` is all it
  # has. Excluding it in a `mac.files` would package the whole checkout, for the
  # reason written against the top-level list. The place this belongs is
  # scripts/afterpack.mjs, which already prunes prebuilds, knows the platform it
  # is packing for, and runs on each architecture *before* the merge.

  # Ad-hoc signature. Apple Silicon refuses to launch a Mach-O binary with no
  # signature at all, and electron-builder invalidates the one Electron ships as
  # soon as it rewrites the bundle — so an unsigned build still has to be
  # ad-hoc signed to be runnable at all. It is not distributable: another
  # machine will still see an unidentified developer.
  #
  # These three are the unsigned defaults, and they are overridden rather than
  # edited. `npm run package:mac` runs scripts/package-mac.mjs, which reads the
  # environment and passes `-c.mac.identity=...`, `-c.mac.hardenedRuntime=true`
  # and `-c.mac.notarize=true` when a complete set of credentials is there —
  # so signing is an environment, not a diff, and an unsigned build stays
  # byte-for-byte the build it was.
  #
  # The set is: APPLE_SIGNING_IDENTITY, the certificate as CSC_LINK (base64
  # .p12 or a file path) plus CSC_KEY_PASSWORD unless it is already in the login
  # keychain, and either APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER or
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID for the notary
  # service. Half a set is refused before the build rather than quietly
  # producing an unsigned artifact. `docs/releasing.md` is the whole account,
  # including which steps of it nobody has been able to verify.
  #
  # Notarization requires the hardened runtime, which is why the two move
  # together, and build/entitlements.mac.plist is already written for it.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

  # Electron's stock Info.plist asks for the camera, the microphone and
  # Bluetooth, with its own placeholder wording — "This app needs access to the
  # camera" — in an application that is a terminal. The strings are not inert:
  # macOS shows that sentence in the consent dialog, and an app that asks for a
  # camera it has no code to use is one somebody is right to be suspicious of.
  #
  # Deleted rather than reworded. electron-builder drops any key whose value is
  # null instead of writing it empty, which is the difference between the plist
  # not carrying the key and it carrying a blank reason.
  extendInfo:
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null

dmg:
  contents:
    - x: 140
      y: 210
      type: file
    - x: 400
      y: 210
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Unsigned. To sign, a maintainer supplies a code-signing certificate and
  # runs the build with CSC_LINK and CSC_KEY_PASSWORD set (or, for a hardware
  # token / cloud HSM, adds a `win.signtoolOptions.sign` hook pointing at their
  # own signing script). Nothing else in this file has to change.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: teamree
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
  # The installer deliberately does not edit PATH. `teamree` is put on PATH by
  # the user with one documented command (see README), which keeps the installer
  # out of the business of rewriting a machine-wide environment variable.

linux:
  icon: build/icons
  category: Development
  synopsis: An ADE built for teamwork
  # fpm refuses to build a .deb without a maintainer, and package.json's author
  # has no address. A GitHub noreply address is used on purpose: a Debian control
  # file must carry something that parses as an address, and this one is real
  # without being a person's inbox.
  maintainer: teamree contributors <zero-abd@users.noreply.github.com>
  # Electron takes its app_id from `desktopName` in package.json, and a desktop
  # environment matches a running window to its launcher by that id. Syncing the
  # installed .desktop filename to the same name is what makes the association
  # hold; StartupWMClass below is the third name that has to agree.
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: teamree
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

deb:
  # Split the way dpkg means it, and checked against the built binary rather
  # than copied from a template: `ldd` on the packaged executable names
  # libgtk-3, libnss3 and libatspi as link-time dependencies, so the app cannot
  # start without them. git is here for the same reason — terminals shell out
  # to it constantly, and an ADE without it is inert.
  depends:
    - git
    - libgtk-3-0
    - libnss3
    - libatspi2.0-0
  # Not linked. libnotify and libsecret-1 appear only as dlopen names inside the
  # Electron binary, and xdg-utils is executed by name; each one missing costs a
  # feature, not the app. Listing them as Depends made the package refuse to
  # configure on a minimal system that runs teamree perfectly well. apt installs
  # Recommends by default, so a normal install is unchanged.
  #
  # libxss1 and libxtst6 are deliberately absent: they are in electron-builder's
  # stock list for older Electron, and this build neither links nor dlopens them.
  recommends:
    - libnotify4
    - libsecret-1-0
    - xdg-utils

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# No update server is configured; `--publish never` is passed by the npm
# scripts so a local build never tries to reach one.
publish: null
