<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Not found — teamree</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0a0c10; --fg:#dfe5ee; --fg-secondary:#a3adbd; --fg-muted:#7d8899;
    --line:#202632; --accent:#8b8cf7; --accent-bright:#a6a7ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  main{max-width:34rem}
  .code{
    font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.08em; text-transform:uppercase; color:var(--fg-muted);
  }
  h1{margin:.6rem 0 0; font-size:clamp(1.6rem,5vw,2.2rem); line-height:1.2; letter-spacing:-.02em}
  p{margin:.9rem 0 0; color:var(--fg-secondary)}
  a{color:var(--accent-bright); text-underline-offset:3px}
  a:hover{color:var(--accent)}
  .back{
    display:inline-block; margin-top:1.6rem; padding:.7rem 1.15rem;
    border:1px solid var(--line); border-radius:9px;
    color:var(--fg); text-decoration:none;
  }
  .back:hover{border-color:var(--accent); color:var(--accent-bright)}
</style>
</head>
<body>
<main>
  <div class="code">Error 404</div>
  <h1>That page isn&rsquo;t here.</h1>
  <p>The link may be out of date, or the page may have moved. If you were after
     the download, <a href="/download/mac">grab the latest macOS build</a> &mdash;
     that link always follows the newest release.</p>
  <a class="back" href="/">Back to the home page</a>
</main>
</body>
</html>
