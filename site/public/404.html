/* Tokens */
:root{--ground:#0B0C0E;--tile:#101114;--tile-2:#171718;--ink:#F3F2EE;--ink-2:#C8C7C2;--muted:#A09F9B;--line:rgb(243 242 238 / 9%);--accent:#8b8cf7;--link:#A9AAFF;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;}

/* Base */
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse 70% 50% at 50% 0,#15161A,#0B0C0E 70%);background-attachment:fixed;color:var(--ink);font-family:var(--font);}
body:before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgb(243 242 238 / 3%) 1px,transparent 1px),linear-gradient(90deg,rgb(243 242 238 / 3%) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000 0,transparent 900px);}
main{width:min(100%,520px);padding:40px;border:1px solid var(--line);border-radius:14px;background:rgb(16 17 20 / 80%);backdrop-filter:blur(16px);}
.defs{position:absolute;width:0;height:0;}

/* Lockup */
.lockup{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;}
.tile{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:var(--tile-2);}
.tile svg{width:62%;height:62%;}
.name{display:flex;align-items:flex-end;gap:4px;}
.word{width:78px;height:20px;overflow:visible;}
.dot{width:4px;height:4px;margin-bottom:3px;border-radius:50%;background:var(--accent);}

/* Copy */
h1{margin:40px 0 0;font-size:40px;line-height:1.2;letter-spacing:-.02em;}
p{margin:12px 0 0;color:var(--ink-2);font-size:17px;line-height:1.6;}
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:24px;color:var(--link);text-underline-offset:3px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;}

/* Responsive layout */
@media(max-width:520px){
  main{padding:28px 24px;}
}
