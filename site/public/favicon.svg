<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="teamree">
  <!--
    The tab icon. A browser draws this at 16-20px, which is why it carries the
    reduced mark (brand/mark-small.svg) and not the full one: at that size the
    window contents of the full mark antialias into grey and the three windows
    close into a single blob.

    Tile radius is 14.4 on a 64 viewBox — 22.5% of the side, the same squircle
    ratio as the app icon and the site header. Two colours, no gradients: this is
    served on every page load.

    The mark is scaled to 94% of the tile about its centre — near enough full
    bleed, and the same MARK_RATIO_SMALL that scripts/make-icons.mjs uses at 32px
    and below, so the favicon and the generated PNGs are one picture. It has to
    be that large. The tightest feature in the reduced mark is the 4-unit gap
    between the bottom of the top window and the top of the lower two; drawn at
    16px that gap is 4 * scale * 16/64 device pixels, so at scale 0.72 it is
    0.72px and antialiases shut — the three windows and the trunk fuse into a
    grey plus sign. At 0.94 the gap is ~1px and the windows stay three. The mark
    brings its own margin (its ink spans 60 of 64 units), so 94% still leaves a
    hair of tile inside the corner radius rather than running flush to it.
  -->
  <rect width="64" height="64" rx="14.4" fill="#0A0C10"/>
  <g transform="translate(1.92 1.92) scale(0.94)" fill="#FFFFFF">
    <!-- the root -->
      <path d="M14 58.8 Q32 45.6 50 58.8 Q32 54.2 14 58.8 Z"/>

      <!-- the trunk -->
      <path d="M29.2 18 H34.8 V57 H29.2 Z"/>

      <!-- the branches -->
      <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
        <path d="M14.9 37 C14.9 43.8 32 45.8 29.2 54.4"/>
        <path d="M49.1 37 C49.1 43.8 32 45.8 34.8 54.4"/>
      </g>

      <!-- the chevron where the branches meet the trunk -->
      <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
        <path d="M26.6 39.6 L32 46.4"/>
        <path d="M37.4 39.6 L32 46.4"/>
      </g>

      <!-- the three windows, solid -->
      <g>
        <path d="M24.4 4.5 H39.6 A3.4 3.4 0 0 1 43 7.9 V16.1 A3.4 3.4 0 0 1 39.6 19.5 H24.4 A3.4 3.4 0 0 1 21 16.1 V7.9 A3.4 3.4 0 0 1 24.4 4.5 Z"/>
        <path d="M5.4 23.5 H20.5 A3.4 3.4 0 0 1 23.9 26.9 V35.1 A3.4 3.4 0 0 1 20.5 38.5 H5.4 A3.4 3.4 0 0 1 2 35.1 V26.9 A3.4 3.4 0 0 1 5.4 23.5 Z"/>
        <path d="M43.5 23.5 H58.6 A3.4 3.4 0 0 1 62 26.9 V35.1 A3.4 3.4 0 0 1 58.6 38.5 H43.5 A3.4 3.4 0 0 1 40.1 35.1 V26.9 A3.4 3.4 0 0 1 43.5 23.5 Z"/>
      </g>
  </g>
</svg>
