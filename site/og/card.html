<!doctype html>
<!-- Source for /og.png, the Open Graph / Twitter card image. Regenerate with
     site/og/render.sh, which rasterises this at exactly 1200x630. -->
<html lang="en"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:
      radial-gradient(900px 520px at 78% -10%, rgb(139 140 247 / 20%), transparent 62%),
      radial-gradient(760px 460px at 6% 108%, rgb(94 224 192 / 11%), transparent 60%),
      #0a0c10;
    color:#dfe5ee;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    padding:76px 84px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative;
  }
  body::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(transparent 0 39px, rgb(255 255 255 / 2.2%) 39px 40px) 0 0/40px 40px;
    mask-image:linear-gradient(to bottom, #000, transparent 70%);
    -webkit-mask-image:linear-gradient(to bottom, #000, transparent 70%);
    pointer-events:none;
  }
  .top{display:flex; align-items:center; gap:22px; position:relative; z-index:1}
  .mark{width:96px;height:96px;border-radius:24px;display:block}
  .word{display:flex; align-items:baseline; gap:9px; font-size:62px; font-weight:640; letter-spacing:-.028em}
  .word i{width:11px;height:11px;border-radius:50%;background:#8b8cf7;display:block}
  h1{position:relative;z-index:1;font-size:56px;line-height:1.12;font-weight:640;letter-spacing:-.028em;max-width:19ch}
  h1 em{font-style:normal;color:#a6a7ff}
  p{position:relative;z-index:1;margin-top:22px;font-size:27px;line-height:1.45;color:#a3adbd;max-width:34ch}
  .foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;color:#7d8899;
        border-top:1px solid #202632;padding-top:26px}
  .foot .chips{display:flex;gap:26px}
  .foot .chips span{display:flex;align-items:center;gap:10px}
  .foot .chips i{width:9px;height:9px;border-radius:50%;display:block}
  .foot .host{color:#dfe5ee}
</style></head><body>
  <div class="top">
    <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#222c3a"/><stop offset="1" stop-color="#0d1014"/></linearGradient></defs>
      <rect x="56" y="56" width="912" height="912" rx="208" fill="url(#g)"/>
      <rect x="60" y="60" width="904" height="904" rx="204" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="8"/>
      <g fill="none" stroke-width="30" stroke-linecap="round">
        <path d="M352 514 Q560 500 668 348" stroke="#5ee0c0"/>
        <path d="M352 514 Q560 528 668 680" stroke="#7aa2ff"/>
        <path d="M352 286 V742" stroke="#e8edf4"/>
      </g>
      <circle cx="668" cy="348" r="29" fill="#5ee0c0"/><circle cx="668" cy="680" r="29" fill="#7aa2ff"/>
      <circle cx="352" cy="286" r="29" fill="#e8edf4"/><circle cx="352" cy="742" r="29" fill="#e8edf4"/>
    </svg>
    <span class="word">teamree<i></i></span>
  </div>
  <div>
    <h1>Five agents. Five worktrees. <em>One window.</em></h1>
    <p>An ADE built for teamwork: coding agents in parallel git worktrees, split terminals, and a CLI they can drive.</p>
  </div>
  <div class="foot">
    <span class="chips">
      <span><i style="background:#5ee0c0"></i>macOS, universal</span>
      <span><i style="background:#8b8cf7"></i>source on GitHub</span>
    </span>
    <span class="host">teamree.us</span>
  </div>
</body></html>
