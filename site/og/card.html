<!doctype html>
<!-- Source for /og.png, the Open Graph / Twitter card image. Regenerate with
     site/og/render.sh, which rasterises this at exactly 1200x630. -->
<html lang="en"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  /* The card is read as a thumbnail far more often than at full size, so the
     type and the mark are scaled for 600x315 rather than for 1200x630, and the
     text block runs most of the width instead of leaving the right third of
     the canvas empty. */
  body{
    background:
      radial-gradient(900px 520px at 78% -10%, rgb(139 140 247 / 20%), transparent 62%),
      radial-gradient(760px 460px at 6% 108%, rgb(94 224 192 / 11%), transparent 60%),
      #0a0c10;
    color:#dfe5ee;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    padding:76px 84px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative;
  }
  body::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(transparent 0 39px, rgb(255 255 255 / 2.2%) 39px 40px) 0 0/40px 40px;
    mask-image:linear-gradient(to bottom, #000, transparent 70%);
    -webkit-mask-image:linear-gradient(to bottom, #000, transparent 70%);
    pointer-events:none;
  }
  .top{display:flex; align-items:center; gap:8px; position:relative; z-index:1}
  /* The mark is a bare glyph here, not a tile: the card is already the dark
     ground, so it needs no rounded plate behind it. currentColor carries the
     white ink through to every path and stroke in the imported geometry. */
  /* 274:64 is the wordmark's own aspect, so 600px wide puts the mark at 140px.
     That is sized for the thumbnail, not for this canvas: a feed renders the
     card at 600x315 or smaller, where 140px becomes 70 — still above the 48px
     at which the full mark's window contents start to close up. At the 104px
     it was, the thumbnail showed a blob.

     The wordmark carries no clear space of its own, so the gap to the dot is
     provided here, and it is small on purpose: at 8px plus the file's own 3
     units of right margin the dot sits about 7 grid units from the final e,
     which reads as part of the word rather than as a stray mark. The dot's
     bottom is put on the word's baseline, which is y=44 of the 64 box. */
  .lockup{width:600px;height:140px;display:block;color:#ffffff;flex:none}
  .top .dot{width:14px;height:14px;border-radius:50%;background:#8b8cf7;display:block;align-self:flex-end;margin-bottom:44px}
  h1{position:relative;z-index:1;font-size:60px;line-height:1.12;font-weight:640;letter-spacing:-.028em;max-width:25ch}
  h1 em{font-style:normal;color:#a6a7ff}
  p{position:relative;z-index:1;margin-top:20px;font-size:28px;line-height:1.45;color:#a3adbd;max-width:48ch}
  .foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;color:#7d8899;
        border-top:1px solid #202632;padding-top:26px}
  .foot .chips{display:flex;gap:26px}
  .foot .chips span{display:flex;align-items:center;gap:10px}
  .foot .chips i{width:9px;height:9px;border-radius:50%;display:block}
  .foot .host{color:#dfe5ee}
</style></head><body>
  <!-- The lockup is brand/wordmark.svg inline: the mark and the drawn word are
       one piece of geometry, so the card, the README and the app icon carry the
       same letterforms rather than whatever grotesque happened to be loaded.
       The accent dot stays as its own element because the wordmark is
       deliberately one flat colour. -->
  <div class="top">
    <svg class="lockup" viewBox="0 0 274 64" fill="currentColor" role="img" aria-label="teamree">
      <!-- the mark, exactly as brand/mark.svg -->
        <g>
          <!-- the root: a wide shallow crescent the trunk flares into -->
            <path d="M15.90 58.66 Q32 49.00 48.10 58.66 Q32 55.50 15.90 58.66 Z"/>

            <!-- the trunk, descending from the top window into the root -->
            <path d="M30.09 21.63 H33.91 V57.06 H30.09 Z"/>

            <!-- the two branches, sweeping down and inward from the lower windows -->
            <g fill="none" stroke="currentColor" stroke-width="3.55" stroke-linecap="round">
              <path d="M15.81 39.00 C15.81 45.00 32.00 47.00 28.85 55.00"/>
              <path d="M48.19 39.00 C48.19 45.00 32.00 47.00 35.15 55.00"/>
            </g>

            <!--
              The chevron where the branches meet the trunk. Each arm is a tapered wedge,
              not a stroke: in the artwork it comes to a point at the top, widens as it
              descends, and its outer edge then sweeps back in and flares into the trunk.
              A constant-width round-capped stroke gets the tip 2 units too fat and the
              foot 1.5 units too wide, which is the difference between an arrowhead and a
              pair of sticks. The right edge runs to 30.60 rather than to the trunk's own
              30.09 so the two shapes overlap instead of sharing an antialiased seam.
            -->
            <g>
              <path d="M27.05 37.60 L25.09 40.02 C26.94 42.22 29.25 44.10 30.13 46.30 L30.60 46.30 L30.60 40.77 Z"/>
              <path d="M36.95 37.60 L38.91 40.02 C37.06 42.22 34.75 44.10 33.87 46.30 L33.40 46.30 L33.40 40.77 Z"/>
            </g>

            <!--
              The three windows. Each is one rounded rect with its contents knocked out
              by fill-rule="evenodd": three chrome dots, a `>` prompt and a `_` cursor.
              The counters never overlap, so the rule is unambiguous.
            -->
            <g fill-rule="evenodd">
              <!-- top centre -->
              <path d="M24.44 5.5 H39.56 A3.38 3.38 0 0 1 42.94 8.88 V18.5 A3.38 3.38 0 0 1 39.56 21.88 H24.44 A3.38 3.38 0 0 1 21.06 18.5 V8.88 A3.38 3.38 0 0 1 24.44 5.5 Z
                       M23.5 8.88 A1.13 1.13 0 0 1 25.75 8.88 A1.13 1.13 0 0 1 23.5 8.88 Z
                       M26.66 8.88 A1.13 1.13 0 0 1 28.91 8.88 A1.13 1.13 0 0 1 26.66 8.88 Z
                       M29.81 8.88 A1.13 1.13 0 0 1 32.06 8.88 A1.13 1.13 0 0 1 29.81 8.88 Z
                       M24.77 13.70 L27.34 15.69 L24.77 17.68 A0.84 0.84 0 0 0 25.80 19.01 L29.23 16.36 A0.84 0.84 0 0 0 29.23 15.02 L25.80 12.36 A0.84 0.84 0 0 0 24.77 13.70 Z
                       M31.00 19.22 L34.81 19.22 A0.81 0.81 0 0 0 34.81 17.59 L31.00 17.59 A0.81 0.81 0 0 0 31.00 19.22 Z"/>
              <!-- lower left -->
              <path d="M5.38 23.31 H20.50 A3.38 3.38 0 0 1 23.88 26.69 V36.31 A3.38 3.38 0 0 1 20.50 39.69 H5.38 A3.38 3.38 0 0 1 2 36.31 V26.69 A3.38 3.38 0 0 1 5.38 23.31 Z
                       M4.44 26.69 A1.13 1.13 0 0 1 6.69 26.69 A1.13 1.13 0 0 1 4.44 26.69 Z
                       M7.59 26.69 A1.13 1.13 0 0 1 9.84 26.69 A1.13 1.13 0 0 1 7.59 26.69 Z
                       M10.75 26.69 A1.13 1.13 0 0 1 13.00 26.69 A1.13 1.13 0 0 1 10.75 26.69 Z
                       M5.70 31.51 L8.28 33.50 L5.70 35.49 A0.84 0.84 0 0 0 6.73 36.82 L10.17 34.17 A0.84 0.84 0 0 0 10.17 32.83 L6.73 30.18 A0.84 0.84 0 0 0 5.70 31.51 Z
                       M11.94 37.03 L15.75 37.03 A0.81 0.81 0 0 0 15.75 35.41 L11.94 35.41 A0.81 0.81 0 0 0 11.94 37.03 Z"/>
              <!-- lower right -->
              <path d="M43.50 23.31 H58.63 A3.38 3.38 0 0 1 62 26.69 V36.31 A3.38 3.38 0 0 1 58.63 39.69 H43.50 A3.38 3.38 0 0 1 40.13 36.31 V26.69 A3.38 3.38 0 0 1 43.50 23.31 Z
                       M42.56 26.69 A1.13 1.13 0 0 1 44.81 26.69 A1.13 1.13 0 0 1 42.56 26.69 Z
                       M45.72 26.69 A1.13 1.13 0 0 1 47.97 26.69 A1.13 1.13 0 0 1 45.72 26.69 Z
                       M48.88 26.69 A1.13 1.13 0 0 1 51.13 26.69 A1.13 1.13 0 0 1 48.88 26.69 Z
                       M43.83 31.51 L46.40 33.50 L43.83 35.49 A0.84 0.84 0 0 0 44.86 36.82 L48.30 34.17 A0.84 0.84 0 0 0 48.30 32.83 L44.86 30.18 A0.84 0.84 0 0 0 43.83 31.51 Z
                       M50.06 37.03 L53.88 37.03 A0.81 0.81 0 0 0 53.88 35.41 L50.06 35.41 A0.81 0.81 0 0 0 50.06 37.03 Z"/>
            </g>
        </g>

        <!-- the word -->
        <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <!-- t -->
          <path d="M84 12 V37.5 A6 6 0 0 0 90 43.5"/>
          <path d="M79 20 H90"/>
          <!-- e -->
          <path d="M118.2 32 A9 9 0 1 0 114.36 39.37"/>
          <path d="M118.2 32 H100.2"/>
          <!-- a -->
          <path d="M145.4 32 A9 9 0 1 1 145.4 31.99"/>
          <path d="M145.4 20 V44"/>
          <!-- m -->
          <path d="M157.3 20 V44"/>
          <path d="M157.3 29 A9 9 0 0 1 175.3 29 V44"/>
          <path d="M175.3 29 A9 9 0 0 1 193.3 29 V44"/>
          <!-- r -->
          <path d="M205.2 20 V44"/>
          <path d="M205.2 29 A9 9 0 0 1 214.2 20"/>
          <!-- e -->
          <path d="M241 32 A9 9 0 1 0 237.16 39.37"/>
          <path d="M241 32 H223"/>
          <!-- e -->
          <path d="M268 32 A9 9 0 1 0 264.16 39.37"/>
          <path d="M268 32 H250"/>
        </g>
    </svg>
    <i class="dot"></i>
  </div>
  <div>
    <h1>Five agents. Five worktrees. <em>One&nbsp;window.</em></h1>
    <p>An ADE built for teamwork: coding agents in parallel git worktrees, split terminals, and a CLI they can drive.</p>
  </div>
  <div class="foot">
    <span class="chips">
      <span><i style="background:#5ee0c0"></i>macOS, universal</span>
      <span><i style="background:#8b8cf7"></i>source on GitHub</span>
    </span>
    <span class="host">teamree.us</span>
  </div>
</body></html>
