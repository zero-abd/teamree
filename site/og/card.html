<!doctype html>
<!-- Source for /og.png, the Open Graph / Twitter card image. Regenerate with
     site/og/render.sh, which rasterises this at exactly 1200x630. -->
<html lang="en"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  /* The card is read as a thumbnail far more often than at full size, so the
     type and the mark are scaled for 600x315 rather than for 1200x630, and the
     text block runs most of the width instead of leaving the right third of
     the canvas empty. */
  body{
    background:
      radial-gradient(900px 520px at 78% -10%, rgb(139 140 247 / 20%), transparent 62%),
      radial-gradient(760px 460px at 6% 108%, rgb(94 224 192 / 11%), transparent 60%),
      #0a0c10;
    color:#dfe5ee;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    padding:76px 84px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative;
  }
  body::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(transparent 0 39px, rgb(255 255 255 / 2.2%) 39px 40px) 0 0/40px 40px;
    mask-image:linear-gradient(to bottom, #000, transparent 70%);
    -webkit-mask-image:linear-gradient(to bottom, #000, transparent 70%);
    pointer-events:none;
  }
  .top{display:flex; align-items:center; gap:8px; position:relative; z-index:1}
  /* The mark is a bare glyph here, not a tile: the card is already the dark
     ground, so it needs no rounded plate behind it. currentColor carries the
     white ink through to every path and stroke in the imported geometry. */
  /* 274:64 is the wordmark's own aspect, so 600px wide puts the mark at 140px.
     That is sized for the thumbnail, not for this canvas: a feed renders the
     card at 600x315 or smaller, where 140px becomes 70 — still above the 48px
     at which the full mark's window contents start to close up. At the 104px
     it was, the thumbnail showed a blob.

     The wordmark carries no clear space of its own, so the gap to the dot is
     provided here, and it is small on purpose: at 8px plus the file's own 3
     units of right margin the dot sits about 7 grid units from the final e,
     which reads as part of the word rather than as a stray mark. The dot's
     bottom is put on the word's baseline, which is y=44 of the 64 box. */
  .lockup{width:600px;height:140px;display:block;color:#ffffff;flex:none}
  .top .dot{width:14px;height:14px;border-radius:50%;background:#8b8cf7;display:block;align-self:flex-end;margin-bottom:44px}
  h1{position:relative;z-index:1;font-size:60px;line-height:1.12;font-weight:640;letter-spacing:-.028em;max-width:25ch}
  h1 em{font-style:normal;color:#a6a7ff}
  p{position:relative;z-index:1;margin-top:20px;font-size:28px;line-height:1.45;color:#a3adbd;max-width:48ch}
  .foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;color:#7d8899;
        border-top:1px solid #202632;padding-top:26px}
  .foot .chips{display:flex;gap:26px}
  .foot .chips span{display:flex;align-items:center;gap:10px}
  .foot .chips i{width:9px;height:9px;border-radius:50%;display:block}
  .foot .host{color:#dfe5ee}
</style></head><body>
  <!-- The lockup is brand/wordmark.svg inline: the mark and the drawn word are
       one piece of geometry, so the card, the README and the app icon carry the
       same letterforms rather than whatever grotesque happened to be loaded.
       The accent dot stays as its own element because the wordmark is
       deliberately one flat colour. -->
  <div class="top">
    <svg class="lockup" viewBox="0 0 274 64" fill="currentColor" role="img" aria-label="teamree">
      <g>
          <!-- the mark, exactly as brand/mark.svg
    </svg>
    <i class="dot"></i>
  </div>
  <div>
    <h1>Five agents. Five worktrees. <em>One&nbsp;window.</em></h1>
    <p>An ADE built for teamwork: coding agents in parallel git worktrees, split terminals, and a CLI they can drive.</p>
  </div>
  <div class="foot">
    <span class="chips">
      <span><i style="background:#5ee0c0"></i>macOS, universal</span>
      <span><i style="background:#8b8cf7"></i>source on GitHub</span>
    </span>
    <span class="host">teamree.us</span>
  </div>
</body></html>
