<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 64" fill="currentColor" role="img" aria-label="teamree">
  <!--
    The small-size lockup: brand/mark-small.svg, then the word.

    Identical to brand/wordmark.svg except that the mark is the reduced form.
    Use this below 48px — in a 28px site header the full mark's window
    contents antialias into grey while the word is still perfectly legible,
    so the lockup has to reduce with the mark.

    The word is drawn, not set. Outlining an installed face would tie the
    wordmark to that font's licence and to whatever is on the machine that
    rendered it; these letterforms are monolinear circles and stems in the
    mark's own language — stroke 6 with round terminals, the same round-capped
    geometry as the `>` prompt inside the windows.

    Metrics: baseline y=44, x-height top y=20, bowl centreline radius 9 so a
    round letter is exactly one x-height across the outside (2*9 + 6 = 24).
    The x-height band 20..44 is centred on y=32, which is the centre of the
    mark's own 5.5..58.44 — that is the optical alignment, and it deliberately
    ignores the t's ascender, as lowercase logotypes do.

    Spacing is optical, not metric, and it is set by the width of the fully
    empty column between two letters rather than by a metric advance: t-e 3.5,
    e-a 3.2, a-m 5.9, m-r 5.9, r-e 2.8, e-e 3.2. Stem-to-stem pairs need the
    most air and a letter that opens to the right needs the least, because the
    white under an r's arm already reads as space. The r's shoulder uses the
    same radius 9 as the m's for that reason: at 7.5 it was an undersized letter
    that did not reach, and the hole after it was the biggest in the word.
    The mark and the word are 14 apart.

    Padding is built in only as bleed: the mark's glyph starts at x=2, the word
    ends at x=271 in a 274 box. There is no clear-space margin baked in — a host
    that wants air adds it outside this box.

    MINIMUM SIZE: 22px tall, and that is a measured floor rather than a
    convention. The mark reduces; the WORD DOES NOT, and it cannot — seven
    letters across 270 units means that at 16px tall the stroke is 1.5 device
    pixels and the e apertures fill, so the word reads as "teamroo". At 22 it
    reads. Below 22, drop the word: show brand/mark-small.svg alone.
  -->

  <!-- the reduced mark, exactly as brand/mark-small.svg -->
  <g>
    <!-- the root -->
      <path d="M14 58.8 Q32 45.6 50 58.8 Q32 54.2 14 58.8 Z"/>

      <!-- the trunk -->
      <path d="M29.2 18 H34.8 V57 H29.2 Z"/>

      <!-- the branches -->
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
        <path d="M14.9 37 C17.1 44.2 32.9 47.6 30 54"/>
        <path d="M49.1 37 C46.9 44.2 31.1 47.6 34 54"/>
      </g>

      <!-- the chevron where the branches meet the trunk -->
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
        <path d="M26.6 39.6 L32 46.4"/>
        <path d="M37.4 39.6 L32 46.4"/>
      </g>

      <!-- the three windows, solid -->
      <g>
        <path d="M24.4 4.5 H39.6 A3.4 3.4 0 0 1 43 7.9 V16.1 A3.4 3.4 0 0 1 39.6 19.5 H24.4 A3.4 3.4 0 0 1 21 16.1 V7.9 A3.4 3.4 0 0 1 24.4 4.5 Z"/>
        <path d="M5.4 23.5 H20.5 A3.4 3.4 0 0 1 23.9 26.9 V35.1 A3.4 3.4 0 0 1 20.5 38.5 H5.4 A3.4 3.4 0 0 1 2 35.1 V26.9 A3.4 3.4 0 0 1 5.4 23.5 Z"/>
        <path d="M43.5 23.5 H58.6 A3.4 3.4 0 0 1 62 26.9 V35.1 A3.4 3.4 0 0 1 58.6 38.5 H43.5 A3.4 3.4 0 0 1 40.1 35.1 V26.9 A3.4 3.4 0 0 1 43.5 23.5 Z"/>
      </g>
  </g>

  <!-- the word -->
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- t -->
    <path d="M84 12 V37.5 A6 6 0 0 0 90 43.5"/>
    <path d="M79 20 H90"/>
    <!-- e -->
    <path d="M118.2 32 A9 9 0 1 0 114.36 39.37"/>
    <path d="M118.2 32 H100.2"/>
    <!-- a -->
    <path d="M145.4 32 A9 9 0 1 1 145.4 31.99"/>
    <path d="M145.4 20 V44"/>
    <!-- m -->
    <path d="M157.3 20 V44"/>
    <path d="M157.3 29 A9 9 0 0 1 175.3 29 V44"/>
    <path d="M175.3 29 A9 9 0 0 1 193.3 29 V44"/>
    <!-- r -->
    <path d="M205.2 20 V44"/>
    <path d="M205.2 29 A9 9 0 0 1 214.2 20"/>
    <!-- e -->
    <path d="M241 32 A9 9 0 1 0 237.16 39.37"/>
    <path d="M241 32 H223"/>
    <!-- e -->
    <path d="M268 32 A9 9 0 1 0 264.16 39.37"/>
    <path d="M268 32 H250"/>
  </g>
</svg>
