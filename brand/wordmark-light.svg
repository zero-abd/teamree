<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 64" color="#0B0D12" style="color:#0B0D12" fill="#0B0D12" role="img" aria-label="teamree">
  <!--
    brand/wordmark.svg with every currentColor replaced by the literal #0B0D12,
    for a light ground. GENERATED — edit brand/wordmark.svg, not this file.

    Two fixed-ink copies exist because GitHub renders a README logo through an
    <img>, where there is no inherited colour for currentColor to resolve to,
    and its SVG sanitiser is not something to bet the project name on. The
    README picks between them with <picture> and prefers-color-scheme.

    The horizontal lockup: brand/mark.svg, then the word.

    The word is drawn, not set. Outlining an installed face would tie the
    wordmark to that font's licence and to whatever is on the machine that
    rendered it; these letterforms are monolinear circles and stems in the
    mark's own language — stroke 6 with round terminals, the same round-capped
    geometry as the `>` prompt inside the windows.

    Metrics: baseline y=44, x-height top y=20, bowl centreline radius 9 so a
    round letter is exactly one x-height across the outside (2*9 + 6 = 24).
    The x-height band 20..44 is centred on y=32, which is the centre of the
    mark's own 5.5..58.44 — that is the optical alignment, and it deliberately
    ignores the t's ascender, as lowercase logotypes do.

    Spacing is optical, not metric, and it is set by the width of the fully
    empty column between two letters rather than by a metric advance: t-e 3.5,
    e-a 3.2, a-m 5.9, m-r 5.9, r-e 2.8, e-e 3.2. Stem-to-stem pairs need the
    most air and a letter that opens to the right needs the least, because the
    white under an r's arm already reads as space. The r's shoulder uses the
    same radius 9 as the m's for that reason: at 7.5 it was an undersized letter
    that did not reach, and the hole after it was the biggest in the word.
    The mark and the word are 14 apart.

    Padding is built in only as bleed: the mark's glyph starts at x=2, the word
    ends at x=271 in a 274 box. There is no clear-space margin baked in — a host
    that wants air adds it outside this box.

    MINIMUM SIZE: 48px tall. That is the full mark's floor, not the word's —
    below 48 the window contents close up while the word is still perfectly
    legible. Use brand/wordmark-small.svg between 22px and 48px. Below 22px do
    not use a lockup at all: the e apertures fill and the word stops reading.
    Show brand/mark-small.svg on its own instead.
  -->

  <!-- the mark, exactly as brand/mark.svg -->
  <g>
    <!-- the root: a wide shallow crescent the trunk flares into -->
      <path d="M15.90 58.66 Q32 49.00 48.10 58.66 Q32 55.50 15.90 58.66 Z"/>

      <!-- the trunk, descending from the top window into the root -->
      <path d="M30.09 21.63 H33.91 V57.06 H30.09 Z"/>

      <!-- the two branches, sweeping down and inward from the lower windows -->
      <g fill="none" stroke="#0B0D12" stroke-width="3.55" stroke-linecap="round">
        <path d="M15.81 39.00 C15.81 45.00 32.00 47.00 28.85 55.00"/>
        <path d="M48.19 39.00 C48.19 45.00 32.00 47.00 35.15 55.00"/>
      </g>

      <!--
        The chevron where the branches meet the trunk. Each arm is a tapered wedge,
        not a stroke: in the artwork it comes to a point at the top, widens as it
        descends, and its outer edge then sweeps back in and flares into the trunk.
        A constant-width round-capped stroke gets the tip 2 units too fat and the
        foot 1.5 units too wide, which is the difference between an arrowhead and a
        pair of sticks. The right edge runs to 30.60 rather than to the trunk's own
        30.09 so the two shapes overlap instead of sharing an antialiased seam.
      -->
      <g>
        <path d="M27.05 37.60 L25.09 40.02 C26.94 42.22 29.25 44.10 30.13 46.30 L30.60 46.30 L30.60 40.77 Z"/>
        <path d="M36.95 37.60 L38.91 40.02 C37.06 42.22 34.75 44.10 33.87 46.30 L33.40 46.30 L33.40 40.77 Z"/>
      </g>

      <!--
        The three windows. Each is one rounded rect with its contents knocked out
        by fill-rule="evenodd": three chrome dots, a `>` prompt and a `_` cursor.
        The counters never overlap, so the rule is unambiguous.
      -->
      <g fill-rule="evenodd">
        <!-- top centre -->
        <path d="M24.44 5.5 H39.56 A3.38 3.38 0 0 1 42.94 8.88 V18.5 A3.38 3.38 0 0 1 39.56 21.88 H24.44 A3.38 3.38 0 0 1 21.06 18.5 V8.88 A3.38 3.38 0 0 1 24.44 5.5 Z
                 M23.5 8.88 A1.13 1.13 0 0 1 25.75 8.88 A1.13 1.13 0 0 1 23.5 8.88 Z
                 M26.66 8.88 A1.13 1.13 0 0 1 28.91 8.88 A1.13 1.13 0 0 1 26.66 8.88 Z
                 M29.81 8.88 A1.13 1.13 0 0 1 32.06 8.88 A1.13 1.13 0 0 1 29.81 8.88 Z
                 M24.77 13.70 L27.34 15.69 L24.77 17.68 A0.84 0.84 0 0 0 25.80 19.01 L29.23 16.36 A0.84 0.84 0 0 0 29.23 15.02 L25.80 12.36 A0.84 0.84 0 0 0 24.77 13.70 Z
                 M31.00 19.22 L34.81 19.22 A0.81 0.81 0 0 0 34.81 17.59 L31.00 17.59 A0.81 0.81 0 0 0 31.00 19.22 Z"/>
        <!-- lower left -->
        <path d="M5.38 23.31 H20.50 A3.38 3.38 0 0 1 23.88 26.69 V36.31 A3.38 3.38 0 0 1 20.50 39.69 H5.38 A3.38 3.38 0 0 1 2 36.31 V26.69 A3.38 3.38 0 0 1 5.38 23.31 Z
                 M4.44 26.69 A1.13 1.13 0 0 1 6.69 26.69 A1.13 1.13 0 0 1 4.44 26.69 Z
                 M7.59 26.69 A1.13 1.13 0 0 1 9.84 26.69 A1.13 1.13 0 0 1 7.59 26.69 Z
                 M10.75 26.69 A1.13 1.13 0 0 1 13.00 26.69 A1.13 1.13 0 0 1 10.75 26.69 Z
                 M5.70 31.51 L8.28 33.50 L5.70 35.49 A0.84 0.84 0 0 0 6.73 36.82 L10.17 34.17 A0.84 0.84 0 0 0 10.17 32.83 L6.73 30.18 A0.84 0.84 0 0 0 5.70 31.51 Z
                 M11.94 37.03 L15.75 37.03 A0.81 0.81 0 0 0 15.75 35.41 L11.94 35.41 A0.81 0.81 0 0 0 11.94 37.03 Z"/>
        <!-- lower right -->
        <path d="M43.50 23.31 H58.63 A3.38 3.38 0 0 1 62 26.69 V36.31 A3.38 3.38 0 0 1 58.63 39.69 H43.50 A3.38 3.38 0 0 1 40.13 36.31 V26.69 A3.38 3.38 0 0 1 43.50 23.31 Z
                 M42.56 26.69 A1.13 1.13 0 0 1 44.81 26.69 A1.13 1.13 0 0 1 42.56 26.69 Z
                 M45.72 26.69 A1.13 1.13 0 0 1 47.97 26.69 A1.13 1.13 0 0 1 45.72 26.69 Z
                 M48.88 26.69 A1.13 1.13 0 0 1 51.13 26.69 A1.13 1.13 0 0 1 48.88 26.69 Z
                 M43.83 31.51 L46.40 33.50 L43.83 35.49 A0.84 0.84 0 0 0 44.86 36.82 L48.30 34.17 A0.84 0.84 0 0 0 48.30 32.83 L44.86 30.18 A0.84 0.84 0 0 0 43.83 31.51 Z
                 M50.06 37.03 L53.88 37.03 A0.81 0.81 0 0 0 53.88 35.41 L50.06 35.41 A0.81 0.81 0 0 0 50.06 37.03 Z"/>
      </g>
  </g>

  <!-- the word -->
  <g fill="none" stroke="#0B0D12" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- t -->
    <path d="M84 12 V37.5 A6 6 0 0 0 90 43.5"/>
    <path d="M79 20 H90"/>
    <!-- e -->
    <path d="M118.2 32 A9 9 0 1 0 114.36 39.37"/>
    <path d="M118.2 32 H100.2"/>
    <!-- a -->
    <path d="M145.4 32 A9 9 0 1 1 145.4 31.99"/>
    <path d="M145.4 20 V44"/>
    <!-- m -->
    <path d="M157.3 20 V44"/>
    <path d="M157.3 29 A9 9 0 0 1 175.3 29 V44"/>
    <path d="M175.3 29 A9 9 0 0 1 193.3 29 V44"/>
    <!-- r -->
    <path d="M205.2 20 V44"/>
    <path d="M205.2 29 A9 9 0 0 1 214.2 20"/>
    <!-- e -->
    <path d="M241 32 A9 9 0 1 0 237.16 39.37"/>
    <path d="M241 32 H223"/>
    <!-- e -->
    <path d="M268 32 A9 9 0 1 0 264.16 39.37"/>
    <path d="M268 32 H250"/>
  </g>
</svg>
