<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="currentColor" role="img" aria-label="teamree">
  <!--
    The small-size form of the mark (brand/mark.svg), for 32px and below.

    Same three windows, same trunk, same branches, same merge — the window
    contents are dropped and every stroke is thickened, because at 16px the
    dots and the `>_` antialias into grey and the three windows close up into
    one blob. Rendered and looked at at 16, 20, 24, 28 and 32 before this shape
    was settled; see the report in the commit that introduced it.

    The two changes beyond "drop the detail": the gap under the top window is
    opened from 1.4 units to 4 so the windows stay three at 16px, and the trunk
    and branches go from 3.6 units to 5.6 and 5 so they survive a single device
    pixel. The root is deepened for the same reason.

    16px is the floor of this artwork, not a target. At 16 it reads as three
    windows, but not reliably as three windows ON a trunk WITH a root: the root
    is the first thing to go, rendering at roughly a third to a half ink, and
    the upper trunk comes out lighter than the windows so the top one can look
    detached. 20px is the first size where all three parts are solid. That was
    measured, and no amount of further thickening fixes it without making the
    mark something other than the owner's — so it is recorded here rather than
    re-litigated.
  -->

  <!-- the root -->
  <path d="M14 58.8 Q32 45.6 50 58.8 Q32 54.2 14 58.8 Z"/>

  <!-- the trunk -->
  <path d="M29.2 18 H34.8 V57 H29.2 Z"/>

  <!-- the branches -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <path d="M14.9 37 C14.9 43.8 32 45.8 29.2 54.4"/>
    <path d="M49.1 37 C49.1 43.8 32 45.8 34.8 54.4"/>
  </g>

  <!-- the chevron where the branches meet the trunk -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <path d="M26.6 39.6 L32 46.4"/>
    <path d="M37.4 39.6 L32 46.4"/>
  </g>

  <!-- the three windows, solid -->
  <g>
    <path d="M24.4 4.5 H39.6 A3.4 3.4 0 0 1 43 7.9 V16.1 A3.4 3.4 0 0 1 39.6 19.5 H24.4 A3.4 3.4 0 0 1 21 16.1 V7.9 A3.4 3.4 0 0 1 24.4 4.5 Z"/>
    <path d="M5.4 23.5 H20.5 A3.4 3.4 0 0 1 23.9 26.9 V35.1 A3.4 3.4 0 0 1 20.5 38.5 H5.4 A3.4 3.4 0 0 1 2 35.1 V26.9 A3.4 3.4 0 0 1 5.4 23.5 Z"/>
    <path d="M43.5 23.5 H58.6 A3.4 3.4 0 0 1 62 26.9 V35.1 A3.4 3.4 0 0 1 58.6 38.5 H43.5 A3.4 3.4 0 0 1 40.1 35.1 V26.9 A3.4 3.4 0 0 1 43.5 23.5 Z"/>
  </g>
</svg>
