# TEMPORARY. The macOS runner used as an instrument.
#
# `build.yml` is the real pipeline and packages an Electron app, which is
# minutes of machine time to reach an answer this branch needs in seconds. This
# runs only what the question is about, and runs the suite several times over so
# a green run is a sample rather than a verdict.
name: macwatch

on:
  push:
    branches: ['fix/teamree-watch-macos']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vitest run src/main/teamwork/macWatchProbe.test.ts
      - name: Probe again, with the machine busy
        run: |
          for i in 1 2 3 4 5 6 7 8; do (while :; do :; done) & done
          npx vitest run src/main/teamwork/macWatchProbe.test.ts || true
          kill %1 %2 %3 %4 %5 %6 %7 %8

  repro:
    name: suite ${{ matrix.run }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: relay
      - run: npm run build:cli
      - run: npm run build
        working-directory: relay
      - run: npm test
