# Builds the installable artifacts for all three platforms.
#
# Each platform is packaged on its own runner on purpose. node-pty is a native
# module: it ships prebuilt binaries for macOS and Windows but none for Linux,
# where `npm ci` compiles one — so a Linux artifact built anywhere else would
# contain no working PTY at all.
#
# Nothing here is signed. Signing needs secrets a fork cannot have; see the
# comments in electron-builder.yml for what a maintainer adds, and pass them to
# the packaging step as environment variables.
name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64 + x64)
            os: macos-latest
            script: package:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - label: Windows (x64)
            os: windows-latest
            script: package:win
            artifacts: dist/*.exe
          - label: Linux (x64)
            os: ubuntu-latest
            script: package:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Package
        run: npm run ${{ matrix.script }}

      # The packaged app is launched and driven through its own CLI, which is
      # the only way to find out whether node-pty survived packaging. Linux
      # runners are headless, so Electron needs a virtual display.
      - name: Verify the packaged app
        if: runner.os != 'Linux'
        run: npm run package:verify

      - name: Verify the packaged app (headless)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run package:verify

      - uses: actions/upload-artifact@v4
        with:
          name: teamree-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
