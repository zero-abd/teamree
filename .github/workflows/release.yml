# Turns a tag into something a colleague can download.
#
# The build is not repeated here. This workflow calls `build.yml`, the same one
# `ci.yml` calls, so the `.dmg` it publishes is the one that passed typecheck,
# lint, format, the full suite, the smoke test and — the check that matters —
# the packaged-app verification, which launches the artifact, drives it through
# the CLI it ships and spawns a real PTY inside it, once against the unpacked
# app and once against the copy inside the mounted image. A release pipeline
# that skipped that would be publishing an app nobody had started.
name: release

# There is deliberately no `push: tags` trigger here any more, and the reason is
# not a preference. No GitHub Actions run in this repository has ever executed a
# step: every one of them ends after six or seven seconds with no logs and the
# annotation
#
#   "The job was not started because recent account payments have failed or your
#    spending limit needs to be increased."
#
# No runner is provisioned, so this workflow cannot build anything. A tag pushed
# while it triggered on tags would produce nothing, take no action, and hang a
# red cross off the release — which is a worse first impression than having no
# automation at all, because it looks like the build failed rather than like it
# never ran.
#
# So releases are cut from a maintainer's Mac instead: `npm run release`, which
# is `scripts/release.mjs` and runs every gate below in one sequence. README's
# "Releases" section and `docs/releasing.md` are the account of it.
#
# To bring this back once a runner can be provisioned, add
#
#   push:
#     tags: ['v*']
#
# above `workflow_dispatch` and delete this comment. Nothing else here needs to
# change; the `guard` job already refuses to publish from anything but a tag.
on:
  # Runnable by hand against a tag. Select the tag as the ref; the `guard` job
  # below refuses a branch, before the build rather than after it, rather than
  # cutting a release named after one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Before the build rather than after it. This was a step in `publish`, which
  # needs `build` — so a `workflow_dispatch` against a branch packaged an
  # Electron app for forty-five minutes and only then refused to publish it. The
  # answer is the same answer and it is knowable in seconds.
  guard:
    name: Insist on a tag
    runs-on: ubuntu-latest
    steps:
      # Through the environment rather than interpolated into the script: the
      # ref is attacker-controllable on a fork, and `${{ }}` inside `run:` is
      # substituted before the shell ever sees it.
      - name: Insist on a tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "release: refusing to publish from $REF — run this against a tag." >&2
            exit 1
          fi
          echo "release: $REF is a tag."

  build:
    needs: guard
    uses: ./.github/workflows/build.yml
    # The `.dmg` is attached to the release inside this same run, so the upload
    # is a courier between two jobs rather than a place to keep anything.
    with:
      retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The only write this project's automation does, and it has never been
      # exercised: nothing has been released from this repository. Asking for it
      # here is necessary and not sufficient — a repository whose Actions
      # workflow-permissions setting is "read repository contents" overrides
      # this, and the first sign would be `gh release create` failing with 403
      # after a full build. Settings → Actions → General → Workflow permissions
      # is where that is turned on; README's "Releases" section says so too.
      contents: write
    steps:
      - uses: actions/checkout@v5

      # `merge-multiple` flattens the per-runner uploads into one directory.
      # Each upload's paths are already relative to `dist/`, so the installers
      # land side by side with no nesting to strip. One runner ships today; the
      # pattern is kept because the build matrix is.
      - uses: actions/download-artifact@v4
        with:
          pattern: teamree-*
          merge-multiple: true
          path: release

      # A release with no files is the failure this is most likely to have, and
      # the least obvious afterwards.
      - name: Check the installers arrived
        run: |
          ls -l release
          count=$(find release -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "release: the build produced no installers to publish." >&2
            exit 1
          fi
          echo "release: $count file(s) to publish."

      # Checksums are the only integrity claim an unsigned build can make, so
      # they are attached as a file and printed into the notes: somebody looking
      # at a warning dialog should not have to download a second file to find
      # out whether the first one is the one that was built here.
      - name: Checksum every installer
        working-directory: release
        # `--` rather than a bare glob: the sums are printed into the notes, so
        # the names in them should be the names of the files and nothing else.
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "teamree \`$TAG\`, for macOS."
            echo
            echo "## Nothing here is signed"
            echo
            echo "There is no Apple Developer certificate behind this build. Signing is a"
            echo "filled-in blank rather than a plan — docs/releasing.md names every variable —"
            echo "but this run had none. macOS will say so, in wording that sounds worse than"
            echo "what it means: the complaint is that nobody has paid a vendor to vouch for it,"
            echo "not that anything was found wrong with it. It has not inspected the app, and"
            echo "it is not telling you the app is harmful."
            echo
            echo "What a signature would have told you, a checksum tells you too. Compare the"
            echo "file you downloaded against \`SHA256SUMS.txt\` below and you know it is the"
            echo "one this build produced. It cannot tell you the build is trustworthy — only"
            echo "that what reached you is what left here."
            echo
            echo "**macOS** will say teamree \"cannot be opened because the developer cannot be"
            echo "verified\". Move the app to \`/Applications\`, then run once:"
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine /Applications/teamree.app'
            echo '```'
            echo
            echo "The full story — why each warning appears, what it does and does not mean,"
            echo "how to put the \`teamree\` CLI on PATH, and how to uninstall — is in"
            echo "[docs/install.md](https://github.com/${{ github.repository }}/blob/$TAG/docs/install.md)."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > notes.md
          cat notes.md

      # A semver pre-release tag (`v0.2.0-rc.1`) is marked as one, so a team
      # trying a candidate is not told it is the release.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac

          # Re-running after a failed publish should finish the job rather than
          # collide with the half-made release the first attempt left behind.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "teamree $TAG" \
              --notes-file notes.md \
              $prerelease
          fi
