# The checks, run against branches and trunk.
#
# There is deliberately nothing here but a call: the steps live in `build.yml`,
# which `release.yml` calls too. Whatever passes on a pull request is therefore
# the same sequence that later produces the downloads, rather than a shorter
# one that happens to share a name with it.
name: ci

# A branch is covered by its pull request and the trunk by its pushes, so no
# commit is checked twice. A full run packages an Electron app; it is worth
# spending once and not worth spending twice.
#
# Tags are absent on purpose, and so is any claim that this runs at all: no
# Actions run in this repository has ever executed a step. Every one ends in six
# or seven seconds with the annotation "The job was not started because recent
# account payments have failed or your spending limit needs to be increased."
# This file is kept as the description of the checks a maintainer runs by hand —
# `npm run release` runs the same sequence — and it will start working the day a
# runner can be provisioned, without being rewritten.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch only needs its newest commit checked; a packaging run per superseded
# push is a lot of machine time to spend on an answer nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
