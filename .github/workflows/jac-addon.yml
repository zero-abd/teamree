name: jac-addon

# The Jac Graph Memory add-on (addons/jac-memory): its tests on every change to it, and on a
# `jac-addon-v*` tag a build published to PyPI through Trusted Publishing, with no stored token.

on:
  pull_request:
    paths:
      - 'addons/jac-memory/**'
      - '.github/workflows/jac-addon.yml'
  push:
    tags:
      - 'jac-addon-v*'

permissions:
  contents: read

concurrency:
  group: jac-addon-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: addons/jac-memory

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv run --python 3.12 --extra test pytest -q
      - run: >-
          uv run --python 3.12 jac check
          src/teamree_jac/graph.jac src/teamree_jac/history.jac src/teamree_jac/memory.jac src/teamree_jac/serve.jac

  build:
    if: startsWith(github.ref, 'refs/tags/jac-addon-v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: The tag names the version in pyproject.toml
        run: |
          wanted="${GITHUB_REF_NAME#jac-addon-v}"
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          test "$wanted" = "$have" || { echo "tag $wanted, pyproject $have"; exit 1; }

      - run: uv build --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: addons/jac-memory/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/teamree-jac/
    permissions:
      # The OIDC token PyPI trusts in place of a password; nothing else is granted.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
