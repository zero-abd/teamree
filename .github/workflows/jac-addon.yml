name: jac-addon

# The Jac Graph Memory add-on (addons/jac-memory): its tests on every change to it, and on a
# `jac-addon-v*` tag a build published to PyPI through Trusted Publishing, with no stored token.

on:
  pull_request:
    paths:
      - 'addons/jac-memory/**'
      - '.github/workflows/jac-addon.yml'
  push:
    tags:
      - 'jac-addon-v*'

permissions:
  contents: read

concurrency:
  group: jac-addon-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: addons/jac-memory

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv run --python 3.12 --extra test pytest -q
      - run: >-
          uv run --python 3.12 jac check
          src/teamree_jac/graph.jac src/teamree_jac/history.jac src/teamree_jac/memory.jac src/teamree_jac/serve.jac

  build:
    if: startsWith(github.ref, 'refs/tags/jac-addon-v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: The tag names the version in pyproject.toml
        run: |
          wanted="${GITHUB_REF_NAME#jac-addon-v}"
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          test "$wanted" = "$have" || { echo "tag $wanted, pyproject $have"; exit 1; }

      - run: uv build --out-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: addons/jac-memory/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/teamree-jac/
    permissions:
      # The OIDC token PyPI trusts in place of a password; nothing else is granted.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
