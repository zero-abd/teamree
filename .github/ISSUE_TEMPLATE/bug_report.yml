name: Bug report
description: Something does not work the way it says it does
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        If macOS refused to open the app on first launch, that is expected and
        [docs/install.md](https://github.com/zero-abd/teamree/blob/main/docs/install.md)
        explains it — no need to file anything.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: teamree version
      description: The version in the About panel, or the commit if you built from source.
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: '15.2, Apple Silicon'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Anything the terminal or the console said
      description: Paste it here. It will be formatted as code, so no backticks needed.
      render: text
    validations:
      required: false
